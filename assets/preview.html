<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex; background: #f7fcff; overflow: hidden;
  }

  /* 侧栏：保持 QQ 主题浅色 */
  .sidebar {
    width: 240px; flex: 0 0 240px; background: #f7fcff;
    border-right: 1px solid #dceaf7; padding: 18px 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .sidebar .brand { font-size: 13px; font-weight: 600; color: #0a76be; margin-bottom: 14px; padding-left: 6px; }
  .sidebar .item {
    padding: 8px 10px; border-radius: 8px; font-size: 13px; color: #06263c;
  }
  .sidebar .item.active { background: #ccebff; }
  .sidebar .group { font-size: 11px; color: #6b8aa3; margin: 14px 0 4px; padding-left: 10px; }
  .sidebar .sub { font-size: 12.5px; color: #33556e; padding: 6px 10px; }

  /* 主区 */
  .wb-home-route {
    flex: 1; position: relative;
    background-image:
      radial-gradient(96% 74% at 50% 46%, rgba(3, 7, 20, 0.80) 0%, rgba(3, 7, 20, 0.52) 40%, rgba(3, 7, 20, 0.12) 74%),
      linear-gradient(180deg,
        rgba(4, 9, 24, 0.34) 0%,
        rgba(4, 9, 24, 0.14) 30%,
        rgba(4, 9, 24, 0.52) 74%,
        rgba(4, 9, 24, 0.74) 100%),
      url("__BG__");
    background-size: cover, cover, cover;
    background-position: center center, center center, center 38%;
    background-repeat: no-repeat, no-repeat, no-repeat;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0 72px;
  }

  .topbar {
    position: absolute; top: 0; left: 0; right: 0; height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; font-size: 12.5px; color: rgba(243,248,255,0.9);
  }

  .hero { width: 100%; max-width: 760px; text-align: center; margin-bottom: 26px; }
  .hero h1 {
    font-size: 30px; font-weight: 600; color: #f7fbff;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.9), 0 4px 28px rgba(0,0,0,0.85), 0 0 70px rgba(2,6,18,0.75);
  }
  .hero p {
    margin-top: 10px; font-size: 13.5px; color: #e3edfbe6;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9), 0 2px 18px rgba(0,0,0,0.8);
  }

  .chips { display: flex; gap: 8px; justify-content: center; margin-bottom: 14px; flex-wrap: wrap; }
  .chip {
    font-size: 12.5px; padding: 6px 14px; border-radius: 999px;
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14);
    color: #e8f1ff; backdrop-filter: blur(8px);
  }
  .chip.on { background: rgba(94,103,250,0.85); border-color: rgba(160,176,255,0.55); color: #fff; }

  .composer { width: 100%; max-width: 760px; }
  .wb-home-composer__input-slot {
    background: rgba(7, 14, 32, 0.62);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 16px;
    box-shadow: 0 18px 48px -20px rgba(0,0,0,0.65);
    padding: 18px 20px 14px;
  }
  .wb-home-composer__input-slot .mainArea { background: transparent; }
  .mainArea textarea {
    width: 100%; height: 46px; background: transparent; border: 0; outline: 0;
    resize: none; font-size: 14px; color: #f3f8ff;
    font-family: inherit;
  }
  .mainArea textarea::placeholder { color: #c3d4ea99; }
  .composer-foot {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 10px; font-size: 12px; color: #c3d4ea99;
  }
  .composer-foot .send {
    width: 30px; height: 30px; border-radius: 50%;
    background: #5e67fa; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 14px;
  }
  .hint { margin-top: 14px; font-size: 11.5px; color: #cfdcece0; text-shadow: 0 1px 6px rgba(0,0,0,0.8); }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">WorkBuddy v0.9.2</div>
    <div class="item active">＋ 新建任务</div>
    <div class="item">◎ 助理</div>
    <div class="item">▤ 项目</div>
    <div class="item">◈ 专家·技能·连接器</div>
    <div class="item">↻ 自动化</div>
    <div class="group">任务 (2)</div>
    <div class="sub">询问模型身份</div>
    <div class="sub">如何拆除文件夹</div>
    <div class="group">空间 (4)</div>
    <div class="sub">workbuddy</div>
    <div class="sub">PPT 设计·帮我对比下</div>
  </aside>

  <main class="wb-home-route">
    <div class="topbar"><span>WorkBuddy</span><span>◐ ⌕ ⋯</span></div>
    <div class="hero">
      <h1>WorkBuddy, 我帮你</h1>
      <p>一个想法，一群伙伴。</p>
    </div>
    <div class="chips">
      <span class="chip">文档处理</span>
      <span class="chip on">日常办公</span>
      <span class="chip">金融服务</span>
      <span class="chip">数据分析及可视化</span>
      <span class="chip">深度研究</span>
    </div>
    <div class="composer">
      <div class="wb-home-composer__input-slot">
        <div class="mainArea">
          <textarea placeholder="今天帮我做些什么？"></textarea>
        </div>
        <div class="composer-foot">
          <span>＋</span>
          <span>DeepSeek V4.1 Flash · 推荐模型　<span class="send">↑</span></span>
        </div>
      </div>
      <div class="hint">选择工作空间 ⌄　　◉ 默认权限 ⌄</div>
    </div>
  </main>
</body>
</html>
